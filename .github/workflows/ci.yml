name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A runner has no "Apple Development" certificate, and project.yml pins one on purpose:
  # a stable signature is what keeps the local Accessibility (TCC) grant alive across
  # rebuilds. That reason doesn't apply here, so signing is turned off on the command
  # line instead of being changed in project.yml.
  SIGNING_OFF: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGN_IDENTITY=
    DEVELOPMENT_TEAM=
  # No arch= here, unlike the Makefile: it lets this run on either an Intel or an Apple
  # silicon runner. Naming the platform is what stops xcodebuild enumerating simulator
  # runtimes and failing over a Mac-only app.
  DEST: -destination platform=macOS

jobs:
  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # Sarvkrit.xcodeproj is generated from project.yml and is not checked in.
      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Sarvkrit.xcodeproj -scheme Sarvkrit \
            -configuration Release $DEST -derivedDataPath build build $SIGNING_OFF

  test:
    # The whole suite runs here, including the smoke tests that touch real hardware.
    #
    # This used to be advisory and pull-request-only, because
    # CameraMonitorSmokeTests.testTheMachineReportsAtLeastOneCamera asserted the machine has
    # a camera and a runner has none — so it failed every time and would have left a
    # permanent red X on main. That test now asks `system_profiler` whether a camera exists
    # before asserting anything, which is a source independent of the CoreMediaIO
    # enumeration under test: on hardware it still catches a broken enumeration, and on a
    # runner it skips instead of failing. The reason for the caveat is gone, so the job runs
    # on main too and reports honestly.
    #
    # Still not in the required checks — that is a repo ruleset setting, not this file.
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild -project Sarvkrit.xcodeproj -scheme Sarvkrit \
            -configuration Debug $DEST -derivedDataPath build test $SIGNING_OFF
