name: Sarvkrit
options:
  bundleIdPrefix: ai.psylief
  deploymentTarget:
    # 14.4, not 14.0: Core Audio process taps are the only public way to do per-app volume, and
    # they do not exist before 14.4. Everything else here would run on 14.0.
    macOS: "14.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 77A36893HP
    CODE_SIGN_STYLE: Manual
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  Sarvkrit:
    type: application
    platform: macOS
    sources:
      - path: Sources/Sarvkrit
        excludes:
          - "Resources/Info.plist"

      # The two update-check files live outside Sources/Sarvkrit on purpose. That path is swept
      # recursively into Copy Bundle Resources — which is why Info.plist above has to be excluded
      # — and a .plist or .sh landing in Contents/Resources by accident is a failure with no
      # visible symptom. Keeping them out of the tree means there is nothing to exclude.
      #
      # `wrapper` is the .app root, not Contents/, so the subpath carries Contents/ itself.
      # SMAppService.agent(plistName:) reads Contents/Library/LaunchAgents/ and nowhere else.
      - path: Sources/LaunchAgent/ai.psylief.sarvkrit.updatecheck.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: Sources/LaunchAgent/check-for-update.sh
        buildPhase: resources
    postBuildScripts:
      # Belt and braces on the executable bit. Git tracks mode 755 and the copy preserves it, but
      # a non-executable script is the quietest failure in this feature: launchd fails the spawn
      # and the app shows nothing at all, because the file it reads simply never appears.
      - name: Ensure the update-check script is executable
        basedOnDependencyAnalysis: false
        script: |
          chmod +x "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/check-for-update.sh"
    settings:
      base:
        PRODUCT_NAME: Sarvkrit
        PRODUCT_BUNDLE_IDENTIFIER: ai.psylief.sarvkrit
        INFOPLIST_FILE: Sources/Sarvkrit/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Sarvkrit/Resources/Sarvkrit.entitlements
        # Signed with the Apple Development cert on purpose: a STABLE signature is what
        # keeps the Accessibility (TCC) grant alive across rebuilds. Never sign ad-hoc.
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  SarvkritTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SarvkritTests
    dependencies:
      - target: Sarvkrit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.psylief.sarvkrit.tests
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sarvkrit:
    build:
      targets:
        Sarvkrit: all
        SarvkritTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SarvkritTests
      # The snapshot suites write PNGs when SARVKRIT_PREVIEW_DIR is set, and xcodebuild does not
      # hand its own environment to the test host — so without this the variable never arrived and
      # every one of those writers was dead code that silently skipped. Passed through as a build
      # setting instead: `make preview` sets it, a plain `make test` leaves it empty and they skip.
      environmentVariables:
        - variable: SARVKRIT_PREVIEW_DIR
          value: "$(SARVKRIT_PREVIEW_DIR)"
          isEnabled: true
    archive:
      config: Release
